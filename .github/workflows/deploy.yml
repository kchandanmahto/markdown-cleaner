name: Deploy Markdown Cleaner to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy on EC2
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Deploy application
        run: |
          cd /opt/markdown-cleaner

          git pull origin main

          sudo docker stop markdown-cleaner || true
          sudo docker rm markdown-cleaner || true

          sudo docker build -t markdown-cleaner .

          sudo docker run -d \
            --restart unless-stopped \
            -p 127.0.0.1:8000:8000 \
            --name markdown-cleaner \
            markdown-cleaner

          sudo systemctl reload nginx

          sudo docker ps
